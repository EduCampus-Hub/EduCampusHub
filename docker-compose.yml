services:
  web:
    build: .
    container_name: educampus_hub
    ports:
      - "8090:80"
    environment:
      COURSES_STORAGE_PATH: /var/lib/educampus/courses.json
    volumes:
      - .:/var/www/html
      - courses_storage:/var/lib/educampus
    restart: unless-stopped

volumes:
  courses_storage:
